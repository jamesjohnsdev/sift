version: 2

before:
  hooks:
    - mkdir -p .man/man1
    - go run ./tools/gen-man .man/man1

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commitSHA={{.ShortCommit}} -X main.buildTime={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: .man/man1/sift.1
        dst: man/man1/sift.1

nfpms:
  - package_name: sift
    homepage: https://github.com/jamesjohnsdev/sift
    description: A TUI email client for Gmail and Outlook
    maintainer: James Johns <192176108+jamesjohnsdev@users.noreply.github.com>
    license: MIT
    formats:
      - deb
    contents:
      - src: .man/man1/sift.1
        dst: /usr/share/man/man1/sift.1

checksum:
  name_template: checksums.txt

changelog:
  use: github
